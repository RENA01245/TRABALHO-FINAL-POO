<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Zona do Sabor - 81</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="bg-danger text-white p-4 d-flex justify-content-between align-items-center">
    <h1 class="m-0">Zona do Sabor - 81</h1>
    <div>
      <button id="alternar-tema" class="btn btn-outline-light me-2">🌙 Alternar Tema</button>
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_braz_logo.svg" alt="Flamengo" class="logo-flamengo">
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <!-- outros links -->
      <li id="menu-login"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <main class="container my-5">
    <!-- CARROSSEL DE DESTAQUES -->
    <section class="mb-5">
      <h2 class="mb-4">Destaques</h2>
      <div id="carousel-container" class="position-relative overflow-hidden">
        <div id="carousel-track" class="d-flex"></div>
        <button id="prevBtn" class="carousel-btn prev">⟨</button>
        <button id="nextBtn" class="carousel-btn next">⟩</button>
      </div>
    </section>

    <!-- Filtros -->
    <div class="mb-4">
      <button class="btn btn-outline-danger" data-filter="all">Todos</button>
      <button class="btn btn-outline-danger" data-filter="Lanche">Lanches</button>
      <button class="btn btn-outline-danger" data-filter="Bebida">Bebidas</button>
      <button class="btn btn-outline-danger" data-filter="Sobremesa">Sobremesas</button>
    </div>

    <!-- Produtos fixos -->
    <section>
      <h2 class="mb-4">Opções</h2>
      <div id="produtos-disponiveis" class="row g-4"></div>
    </section>

    <!-- Carrinho -->
    <section>
      <h2 class="mb-4">Finaliza Pedido</h2>
      <ul id="lista-produtos" class="list-group mb-3"></ul>
      <h3 id="total">Total: R$ 0.00</h3>

      <div class="input-group my-3">
        <input id="cupom" class="form-control" placeholder="Digite o cupom (Ex: MENGAO2025)" />
        <button class="btn btn-outline-primary" id="aplicar-cupom">Aplicar Cupom</button>
        <button id="copiar-cupom" class="btn btn-outline-secondary">Copiar</button>
      </div>
      <span id="desconto-msg" class="text-success"></span>
    </section>

    <!-- Login Form -->
    <section>
      <h2 class="mb-4">Login</h2>
      <form id="login-form">
        <input id="usuario" type="text" placeholder="Usuário" maxlength="15" />
        <input id="senha" type="password" placeholder="Senha" />
        <button type="submit">Entrar</button>
        <div id="login-erro" style="color:#d90429; font-weight:600; margin-top:10px; display:none;"></div>
      </form>
    </section>
  </main>

  <!-- Scripts -->
  
  <script type="module" src="../dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
