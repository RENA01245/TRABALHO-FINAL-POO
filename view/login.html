<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <section class="login-section">
      <div class="login-container">
        <h2>Login</h2>
        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="usuario">Usuário</label>
            <input id="usuario" type="text" maxlength="15" placeholder="Digite seu usuário" required>
          </div>
          <div class="form-group">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Digite sua senha" required>
          </div>
          <button type="submit" class="login-btn">Entrar</button>
          <div id="login-erro" class="login-form__error"></div>
        </form>
      </div>
    </section>
  </main>
  <script src="../dist/login.js"></script>
</body>
</html>
